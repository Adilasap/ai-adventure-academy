name: Import prepared website source

on:
  push:
    branches: [main]
    paths:
      - "upload-parts/**"

permissions:
  contents: write

concurrency:
  group: import-prepared-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct archive, correcting one transfer-character error
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, io, tarfile
          from pathlib import Path

          names = [f"{i:02d}" for i in range(8)]
          parts = []
          for name in names:
              p = Path(f"upload-parts/part-{name}.txt")
              if not p.exists():
                  raise SystemExit(f"Missing source part {name}")
              parts.append(p.read_text().strip())

          encoded = "".join(parts)
          # The transfer introduced one extra character into the final piece.
          # Try deleting one character from that piece and accept only a valid
          # gzip CRC + tar archive containing the project's package.json.
          prefix = "".join(parts[:-1])
          tail = parts[-1]
          recovered = None
          for offset in range(len(tail)):
              candidate = prefix + tail[:offset] + tail[offset + 1:]
              try:
                  binary = base64.b64decode(candidate, validate=True)
                  tar_bytes = gzip.decompress(binary)  # validates gzip CRC
                  with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as archive:
                      members = archive.getnames()
                      if "ai-adventure-academy/package.json" not in members:
                          continue
                      if "ai-adventure-academy/src" not in members:
                          continue
                  recovered = tar_bytes
                  print(f"Recovered archive by removing extra character at final-part offset {offset}.")
                  break
              except (ValueError, OSError, EOFError, tarfile.TarError):
                  continue

          if recovered is None:
              raise SystemExit("Could not recover the source archive; no matching valid gzip/tar candidate.")
          Path("/tmp/source.tar").write_bytes(recovered)

          with tarfile.open("/tmp/source.tar", "r:") as archive:
              archive.extractall("/tmp/source-project", filter="data")
          PY
          test -d /tmp/source-project/ai-adventure-academy
          test -f /tmp/source-project/ai-adventure-academy/package.json
          cp -a /tmp/source-project/ai-adventure-academy/. .

          rm -rf upload-parts
          rm -f .github/workflows/import-source.yml
          rmdir .github/workflows .github 2>/dev/null || true
          rm -rf /tmp/source-project /tmp/source.tar

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes found."
            exit 0
          fi
          git commit -m "Add AI Adventure Academy website source"
          git push origin HEAD:main
