name: Import prepared website source

on:
  push:
    branches: [main]
    paths:
      - "upload-parts/**"

permissions:
  contents: write

concurrency:
  group: import-prepared-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct and install website source
        shell: bash
        run: |
          set -euo pipefail
          parts=(00 01 02 03 04 05)
          for part in "${parts[@]}"; do
            if [ ! -s "upload-parts/part-${part}.txt" ]; then
              echo "Waiting for source archive part ${part}; nothing to do yet."
              exit 0
            fi
          done

          for part in "${parts[@]}"; do
            cat "upload-parts/part-${part}.txt"
          done > /tmp/source.zip.b64
          base64 --decode /tmp/source.zip.b64 > /tmp/source.zip
          unzip -tq /tmp/source.zip
          mkdir -p /tmp/source-project
          unzip -q /tmp/source.zip -d /tmp/source-project
          test -d /tmp/source-project/ai-adventure-academy
          cp -a /tmp/source-project/ai-adventure-academy/. .

          # Remove temporary transfer data and this one-time import workflow.
          rm -rf upload-parts
          rm -f .github/workflows/import-source.yml
          rmdir .github/workflows .github 2>/dev/null || true
          rm -rf /tmp/source-project /tmp/source.zip /tmp/source.zip.b64

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes found."
            exit 0
          fi
          git commit -m "Add AI Adventure Academy website source"
          git push origin HEAD:main
