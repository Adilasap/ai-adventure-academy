name: Import prepared project source

on:
  push:
    branches: [main]
    paths:
      - "upload-parts/**"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct source archive when all parts exist
        shell: bash
        run: |
          # The archive is transferred in 17 pieces; earlier pushes safely no-op.
          if [ ! -f upload-parts/part-16.txt ]; then
            echo "Waiting for all source archive parts."
            exit 0
          fi
          for i in $(seq -w 0 16); do
            if [ ! -s "upload-parts/part-${i}.txt" ]; then
              echo "Missing source part ${i}; not importing."
              exit 1
            fi
          done

          cat upload-parts/part-{00..16}.txt > /tmp/source.zip.b64
          base64 --decode /tmp/source.zip.b64 > /tmp/source.zip
          mkdir -p /tmp/project
          unzip -q /tmp/source.zip -d /tmp/project
          test -d /tmp/project/ai-adventure-academy
          cp -a /tmp/project/ai-adventure-academy/. .
          rm -rf upload-parts /tmp/source.zip /tmp/source.zip.b64 /tmp/project

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add AI Adventure Academy source for Vercel"
          git push
